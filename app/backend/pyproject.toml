[project]
name = "creatoros-backend"
version = "0.8.0"
description = "CreatorOS Studio local backend"
license = { text = "Apache-2.0" }
authors = [{ name = "CreatorOS contributors" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlalchemy>=2.0.36",
  "alembic>=1.14", "pydantic>=2.9", "pydantic-settings>=2.6",
  "httpx>=0.27", "python-multipart>=0.0.12", "psutil>=6.1",
  "jinja2>=3.1", "structlog>=24.4",
  # Windows has no IANA time zone database of its own; zoneinfo needs this package or every
  # schedule validation fails with "No time zone found with key Europe/Paris".
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "ruff>=0.8", "respx>=0.21"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs a real Ollama runtime (opt in with CREATOROS_RUN_LIVE_AI=1)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
